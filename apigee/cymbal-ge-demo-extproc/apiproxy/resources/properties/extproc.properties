# Proxy-scoped property set "extproc" (read as propertyset.extproc.<key>).
# credit_bureau_hosts: comma/space separated exact Host values of the mock credit bureau (Cloud Run
#   cymbal-ge-demo-credit-bureau, both URL forms). scripts/setup-apigee.sh replaces the placeholder in a
#   staged copy from CREDIT_BUREAU_HOSTS or from `gcloud run services describe` at import time.
#   While the placeholder is in place nothing is governed (fail-open for the agent's other traffic).
credit_bureau_hosts=__CREDIT_BUREAU_HOSTS__
# identity_headers: candidate headers carrying the calling agent's identity, first non-empty wins.
#   Not documented for Agent Gateway authz callouts (2026-11-17): confirm in a debug session and edit.
identity_headers=x-agent-identity,x-goog-agent-identity,x-client-spiffe-id,x-forwarded-client-cert,x-goog-authenticated-user-email
