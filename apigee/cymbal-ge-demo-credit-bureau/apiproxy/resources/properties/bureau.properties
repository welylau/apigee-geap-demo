# Proxy-scoped property set "bureau" (read as propertyset.bureau.<key>).
# Filled in a staged copy at import time by scripts/setup-apigee.sh from CREDIT_BUREAU_URL (service base URL) or
# from `gcloud run services describe cymbal-ge-demo-credit-bureau --region asia-southeast1`
# (deterministic https://<service>-<project-number>.<region>.run.app URL preferred).
# target_url = <base>/mcp, target_host = host of <base>, audience = <base> (GoogleIDToken audience for Cloud Run IAM).
target_url=__CREDIT_BUREAU_URL__
target_host=__CREDIT_BUREAU_HOST__
audience=__CREDIT_BUREAU_AUDIENCE__
